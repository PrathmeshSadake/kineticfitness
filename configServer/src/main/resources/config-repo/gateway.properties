server.port=8080

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# Routes (reactive gateway)
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://userService
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webflux.routes[1].id=activity-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://activityService
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/activities/**

spring.cloud.gateway.server.webflux.routes[2].id=ai-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://aiService
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/ai/**

# CORS for React frontend
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600
